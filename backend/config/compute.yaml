targets:
  cpu:
    backend: inprocess
  local_gpu:
    backend: http
    url: http://scene-compute:9000
    token: ${COMPUTE_TOKEN}
    chunk_size: 25000000
  colab:
    backend: http
    url: ${COLAB_URL}
    token: ${COMPUTE_TOKEN}
    chunk_size: 100000000
    # The Cloudflare tunnel adds seconds to every request, so uploads and Publications move many files at once.
    transfer_concurrency: 16
    timeout: 300
    startup_timeout: 900
    poll_interval: 3

