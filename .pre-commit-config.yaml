default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files # no model weights
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Third-party files stay byte-for-byte as published.
      - id: trailing-whitespace
        exclude: &third_party ^(src/scenetiq/vendor/|\.agents/|\.claude/)
      - id: end-of-file-fixer
        exclude: *third_party

  # Local hooks run the tool versions pinned in uv.lock and frontend/package-lock.json.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-build
        name: frontend typecheck + build
        entry: npm --prefix frontend run build
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
