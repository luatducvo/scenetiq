[project]
name = "scenetiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luatducvo", email = "luatducvo0106@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "gradio>=6.32.0",
    "huggingface-hub>=2.4.0",
]

[project.scripts]
scenetiq = "scenetiq:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "smoke: smoke tests",
]
