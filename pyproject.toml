[project]
name = "scenetiq"
version = "0.1.0"
description = "Reconstruct a static Scene from 2D photos and find its Instances with open-vocabulary Queries."
readme = "README.md"
authors = [
    { name = "luatducvo", email = "lvo017205@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=1.26",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "scipy>=1.11",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.12",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/scenetiq/vendor", "notebooks", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.src]
exclude = ["src/scenetiq/vendor", "notebooks", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and the real model stack (run on Colab)"]
addopts = "-m 'not gpu'"

[tool.ty.analysis]
# GPU-only model stack from requirements-gpu.txt, imported lazily inside pipeline stages.
allowed-unresolved-imports = [
    "open3d.**",
    "torch.**",
    "sam2.**",
    "transformers.**",
    "geocalib.**",
    # Preinstalled in the Colab kernel; scenetiq.colab imports it lazily for live output.
    "IPython.**",
]
